<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>KlaimSatu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: auth = split brand panel + form; app = fixed sidebar, topbar, workspace panes. Palette: navy + kuning dari identitas deck. */
:root{
  --bg:#F2F5F9;--surface:#FFFFFF;--surface2:#F7F9FC;--line:#DCE4EC;--line2:#EAF0F5;
  --text:#0E2233;--muted:#566C80;--primary:#00406A;--primary-h:#052C4A;--on-primary:#FFFFFF;

  --pend-fg:#7A4F00;--pend-bg:#FFF1CC;--rev-fg:#A3221A;--rev-bg:#FDE7E5;--disp-fg:#6B2FA3;--disp-bg:#F1E6FA;
  --ok-fg:#17693F;--ok-bg:#DFF3E7;--done-fg:#27506F;--done-bg:#E1EDF6;--info-fg:#1B5CA8;--info-bg:#E3EEFA;
  --c1:#00406A;--c2:#E0A800;--c3:#C4372D;--c4:#2E8B57;--c5:#7A52B3;--grid:#E3EAF1;
  --shadow:0 1px 2px rgba(9,35,58,.06),0 4px 14px rgba(9,35,58,.05);
  --f:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1620;--surface:#102232;--surface2:#0D1D2B;--line:#22394D;--line2:#1A2F42;
  --text:#E6EEF5;--muted:#93A9BB;--primary:#3B8FD0;--primary-h:#5BA8E0;--on-primary:#04121D;
  --side:#07141F;--side-text:#9DB3C6;--side-act:#12324B;
  --pend-fg:#FFD76A;--pend-bg:#3A2E0B;--rev-fg:#FF9B93;--rev-bg:#3F1815;--disp-fg:#D2A8F5;--disp-bg:#2E1B42;
  --ok-fg:#7BDBA6;--ok-bg:#12372A;--done-fg:#9CC7E8;--done-bg:#15324A;--info-fg:#8FC0F5;--info-bg:#14304D;
  --c1:#5BA8E0;--c2:#FFD500;--c3:#FF8A80;--c4:#5FCB93;--c5:#B692E8;--grid:#1D3447;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1620;--surface:#102232;--surface2:#0D1D2B;--line:#22394D;--line2:#1A2F42;
  --text:#E6EEF5;--muted:#93A9BB;--primary:#3B8FD0;--primary-h:#5BA8E0;--on-primary:#04121D;
  --side:#07141F;--side-text:#9DB3C6;--side-act:#12324B;
  --pend-fg:#FFD76A;--pend-bg:#3A2E0B;--rev-fg:#FF9B93;--rev-bg:#3F1815;--disp-fg:#D2A8F5;--disp-bg:#2E1B42;
  --ok-fg:#7BDBA6;--ok-bg:#12372A;--done-fg:#9CC7E8;--done-bg:#15324A;--info-fg:#8FC0F5;--info-bg:#14304D;
  --c1:#5BA8E0;--c2:#FFD500;--c3:#FF8A80;--c4:#5FCB93;--c5:#B692E8;--grid:#1D3447;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--f);padding-left:0;padding-right:0;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}h2{font-size:16px;font-weight:650}h3{font-size:14px;font-weight:650}
p{margin:0}
.muted{color:var(--muted)}.sm{font-size:12px}.xs{font-size:11px}.b{font-weight:600}.mono{font-variant-numeric:tabular-nums}
.ic{flex:none}
.row{display:flex;align-items:center;gap:8px}.col{display:flex;flex-direction:column;gap:8px}.sp{flex:1}.wrap{flex-wrap:wrap}
.grid{display:grid;gap:16px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface2);border-color:var(--muted)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}.btn.pri:hover{background:var(--primary-h);border-color:var(--primary-h)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.btn.acc:hover{filter:brightness(.95)}
.btn.dng{color:var(--rev-fg);border-color:var(--rev-bg);background:var(--rev-bg)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}.btn.blk{width:100%;height:44px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--primary);font-weight:600;text-decoration:underline;text-underline-offset:3px}
/* form */
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-weight:600;font-size:12.5px}
.inp{height:42px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 12px;transition:border-color .15s,box-shadow .15s}
textarea.inp{height:auto;padding:10px 12px;resize:vertical;min-height:84px}
.inp:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 22%,transparent)}
.inp.err{border-color:var(--rev-fg)}
.pw{position:relative}.pw .inp{padding-right:42px}.pw button{position:absolute;right:4px;top:4px;width:34px;height:34px;border:0;background:none;color:var(--muted);border-radius:6px;display:grid;place-items:center}
.hint{font-size:12px;color:var(--muted)}.errt{font-size:12px;color:var(--rev-fg);min-height:0}
.alert{display:flex;gap:10px;padding:10px 12px;border-radius:8px;font-size:13px;align-items:flex-start}
.alert.err{background:var(--rev-bg);color:var(--rev-fg)}.alert.ok{background:var(--ok-bg);color:var(--ok-fg)}.alert.info{background:var(--info-bg);color:var(--info-fg)}.alert.warn{background:var(--pend-bg);color:var(--pend-fg)}
.meter{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:2px}.meter i{height:4px;border-radius:2px;background:var(--line)}
.reqs{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:12px;color:var(--muted);margin:0;padding:0;list-style:none}.reqs li{display:flex;gap:6px;align-items:center}.reqs li.ok{color:var(--ok-fg)}.reqs li:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5}.reqs li.ok:before{opacity:1}
/* badges */
.bd{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.bd:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.bd.pending{background:var(--pend-bg);color:var(--pend-fg)}.bd.revisi{background:var(--rev-bg);color:var(--rev-fg)}.bd.dispute{background:var(--disp-bg);color:var(--disp-fg)}.bd.disetujui{background:var(--ok-bg);color:var(--ok-fg)}.bd.selesai{background:var(--done-bg);color:var(--done-fg)}.bd.info{background:var(--info-bg);color:var(--info-fg)}.bd.draft{background:var(--line2);color:var(--muted)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;background:var(--line2);font-size:11px;font-weight:600;color:var(--muted)}
.code{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12.5px;font-weight:600;background:var(--info-bg);color:var(--info-fg);padding:1px 6px;border-radius:5px}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card.pad{padding:18px}.card>header{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.card>.body{padding:18px}
/* AUTH */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
.brand{position:relative;background:var(--side);color:#fff;padding:48px 56px;display:flex;flex-direction:column;gap:28px;overflow:hidden}
.brand .stripes{position:absolute;inset:0 auto 0 0;display:flex}.brand .stripes i{display:block;width:14px}
.brand .stripes i:nth-child(1){background:var(--accent);width:34px}.brand .stripes i:nth-child(2){background:#00406A;width:22px}.brand .stripes i:nth-child(3){background:#2A5580;width:12px}
.brand>*:not(.stripes){position:relative;margin-left:44px}
.logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:20px;letter-spacing:-.01em}
.logo .mk{width:38px;height:38px;border-radius:10px;background:var(--accent);color:#052C4A;display:grid;place-items:center}
.brand h2{font-size:30px;line-height:1.2;font-weight:700;letter-spacing:-.02em;max-width:19ch}
.brand .lead{color:#B8CBDB;max-width:46ch;font-size:14.5px}
.feat{display:grid;gap:14px;margin-top:4px}.feat div{display:flex;gap:12px;align-items:flex-start;color:#DCE8F2}.feat .fi{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.08);display:grid;place-items:center;color:var(--accent);flex:none}
.feat b{display:block;color:#fff;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}.chips span{font-size:11.5px;border:1px solid rgba(255,255,255,.22);padding:4px 10px;border-radius:999px;color:#CFDDEA}
.formside{display:grid;place-items:center;padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.fbox{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px}.fbox.wide{max-width:520px}
.fbox h1{font-size:26px}
.demo{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;background:var(--surface2);font-size:12.5px}
.sep{height:1px;background:var(--line2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* APP SHELL */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-text);display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;gap:4px}
.side .logo{color:#fff;font-size:17px;padding:2px 8px 18px}.side .logo .mk{width:32px;height:32px;border-radius:9px}
.side .grp{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#6F8CA5;padding:14px 10px 6px;font-weight:600}
.nav{display:flex;align-items:center;gap:11px;height:40px;padding:0 10px;border-radius:9px;color:var(--side-text);background:none;border:0;text-align:left;width:100%;font-weight:500;position:relative}
.nav:hover{background:rgba(255,255,255,.06);color:#fff}.nav.on{background:var(--side-act);color:#fff}.nav.on:before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:4px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav .n{margin-left:auto;background:var(--accent);color:#2E2600;font-size:11px;font-weight:700;border-radius:999px;padding:0 7px;min-width:20px;text-align:center}
.side .me{margin-top:auto;padding:12px;border-radius:10px;background:rgba(255,255,255,.06);display:flex;gap:10px;align-items:center}
.av{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#2E2600;font-weight:700;display:grid;place-items:center;flex:none;font-size:13px}
.main{display:flex;flex-direction:column;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding:12px 28px;border-bottom:1px solid var(--line)}
.srch{position:relative;max-width:360px;flex:1}.srch .ic{position:absolute;left:12px;top:12px;color:var(--muted)}.srch .inp{padding-left:38px;height:40px}
.seg{display:inline-flex;background:var(--line2);border-radius:9px;padding:3px}.seg button{border:0;background:none;height:30px;padding:0 12px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--muted)}.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.iconb{width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative;color:var(--text)}
.iconb .dot{position:absolute;top:7px;right:8px;min-width:16px;height:16px;border-radius:8px;background:var(--rev-fg);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.page{padding:26px 28px 56px;display:flex;flex-direction:column;gap:20px;max-width:1500px;width:100%}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}.ph p{color:var(--muted);margin-top:4px}
.crumb{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:6px}.crumb button{background:none;border:0;color:var(--primary);font-weight:600;padding:0}
.menu{position:absolute;right:0;top:46px;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px;z-index:20}
.menu button{display:flex;gap:10px;align-items:center;width:100%;height:38px;border:0;background:none;padding:0 10px;border-radius:7px;text-align:left;font-weight:500}.menu button:hover{background:var(--surface2)}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;transition:border-color .15s}.kpi:hover{border-color:var(--primary)}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}.kpi .l{font-size:12px;color:var(--muted);font-weight:500;display:flex;gap:6px;align-items:center}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}.stack i{display:block;min-width:4px}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}.leg span{display:inline-flex;align-items:center;gap:6px}.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.sla{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;padding:2px 9px;border-radius:6px;font-variant-numeric:tabular-nums}
.sla.ok{background:var(--ok-bg);color:var(--ok-fg)}.sla.warn{background:var(--pend-bg);color:var(--pend-fg)}.sla.bad{background:var(--rev-bg);color:var(--rev-fg)}.sla.na{background:var(--line2);color:var(--muted)}
/* table */
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:760px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface2)}
tr:last-child td{border-bottom:0}.r{text-align:right}
/* workspace */
.ws{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}.tabs button{height:42px;padding:0 14px;border:0;background:none;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}.tabs button.on{color:var(--primary);border-color:var(--primary)}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:0}.kv>*{padding:10px 0;border-bottom:1px solid var(--line2);display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;min-height:46px}.kv .k{color:var(--muted);font-size:12.5px;flex-direction:column;align-items:flex-start;justify-content:center;flex-wrap:nowrap;gap:0}
.kv .tb{border:0;background:none;color:var(--muted);width:30px;height:30px;border-radius:7px;display:grid;place-items:center}.kv .tb:hover{background:var(--rev-bg);color:var(--rev-fg)}
.kv .tb.on{background:var(--rev-bg);color:var(--rev-fg)}
.doc{border:1px solid var(--line);border-radius:10px;background:var(--surface2);padding:16px;display:grid;gap:8px;font-size:12.5px}
.thread{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.thread.open{border-color:color-mix(in srgb,var(--rev-fg) 45%,var(--line))}
.msg{display:flex;gap:10px}.msg .av{width:28px;height:28px;font-size:11px}.msg .bub{background:var(--surface2);border-radius:10px;padding:8px 11px;flex:1;min-width:0;overflow-wrap:anywhere}
.msg.bp .av{background:var(--primary);color:var(--on-primary)}
.diff{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px}.diff s{color:var(--rev-fg)}
.tl{display:flex;flex-direction:column}.tl .it{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;position:relative;padding-bottom:14px}
.tl .it:before{content:"";position:absolute;left:8px;top:16px;bottom:-2px;width:2px;background:var(--line)}.tl .it:last-child:before{display:none}
.tl .pt{width:18px;height:18px;border-radius:50%;background:var(--surface);border:2px solid var(--primary);margin-top:1px}.tl .pt.a{border-color:var(--c2)}.tl .pt.r{border-color:var(--rev-fg)}.tl .pt.g{border-color:var(--ok-fg)}
/* BA */
.baw{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.paper{background:#fff;color:#14202B;border:1px solid var(--line);border-radius:6px;padding:40px 44px;box-shadow:var(--shadow);font:13px/1.6 'Times New Roman',Georgia,serif;max-width:820px;margin:0 auto;width:100%}
.paper h3{font:700 15px/1.3 'Times New Roman',Georgia,serif;text-align:center;letter-spacing:.02em;text-transform:uppercase}
.paper .kop{text-align:center;border-bottom:3px double #14202B;padding-bottom:10px;margin-bottom:16px}
.paper table{min-width:0;font-size:12.5px;margin:8px 0}.paper th,.paper td{border:1px solid #9AA8B5;padding:5px 8px;background:none;color:#14202B;text-transform:none;letter-spacing:0;font-weight:400;font-size:12.5px}.paper th{background:#EEF2F6;font-weight:700;text-align:left}
.paper tr:last-child td{border-bottom:1px solid #9AA8B5}.paper .sigs{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px;text-align:center}.paper .sig{min-height:128px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px}
.paper .sig img{height:62px;max-width:100%}.paper .stamp{font:600 10px/1.3 ui-monospace,Menlo,monospace;color:#1F6B44;border:1px solid #1F6B44;border-radius:4px;padding:3px 6px}
.steps{display:grid;gap:0}.stp{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding-bottom:14px;position:relative}.stp:before{content:"";position:absolute;left:12px;top:26px;bottom:0;width:2px;background:var(--line)}.stp:last-child:before{display:none}
.stp .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--line2);color:var(--muted)}.stp.done .n{background:var(--ok-bg);color:var(--ok-fg)}.stp.cur .n{background:var(--accent);color:var(--on-accent)}
/* modal toast */
.ov{position:fixed;inset:0;background:rgba(5,20,32,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:520px;max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.modal>header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line2)}.modal>.body{padding:20px;display:flex;flex-direction:column;gap:14px}.modal>footer{padding:14px 20px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end}
canvas.pad{width:100%;height:150px;border:1.5px dashed var(--line);border-radius:10px;background:#fff;touch-action:none;cursor:crosshair;display:block}

/* ============ render ============ */
function render(){const a=$('#app');const auth=['masuk','daftar','ganti-password'].includes(S.route);
 if(!S.user&&!auth)S.route='masuk';
 const V={masuk:vLogin,daftar:vRegister,'ganti-password':()=>vChangePw(false),dashboard:vDash,klaim:vClaims,revisi:vRevisi,'ba-list':vBAList,notif:vNotif,audit:vAudit,analytics:vAnalytics,akun:vAkun,claim:vClaim,ba:vBA};
 const keep=document.activeElement&&document.activeElement.id,pos=document.activeElement&&document.activeElement.selectionStart;
 const html=V[S.route]();a.innerHTML=auth||!S.user?html:shell(html);document.title=(TITLES[S.route]||'Masuk')+' · KlaimSatu';
 if(keep){const e=document.getElementById(keep);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(_){}}}
 if(S.route==='akun'&&S.pwFocus){S.pwFocus=false;$('#p-o')?.focus()}}

document.addEventListener('click',async e=>{const g=e.target.closest('[data-go]');
 if(S.menu&&!e.target.closest('.menu')&&!e.target.closest('[data-act="menu"]')){S.menu=false;if(!g&&!e.target.closest('[data-act]'))render()}
 if(g){S.flash='';if(g.dataset.pw)S.pwFocus=true;return nav(g.dataset.go,g.dataset.a||null)}
 const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,x=S.route==='claim'||S.route==='ba'?claim(S.arg):null;
 const A={
  eye(){const i=$('#'+b.dataset.t);const s=i.type==='password';i.type=s?'text':'password';b.innerHTML=I(s?'eyeoff':'eye',18)},
  'fill-demo'(){$('#l-u').value='mik1a';$('#l-p').value='mik1a'},

  role(){S.role=b.dataset.r;render();toast('Tampilan sebagai '+roleName(S.role),'user')},
  kpi(){const s=b.dataset.s;if(s==='sla'){S.f.st='all';return nav('klaim')}S.f.st=s;nav('klaim')},
  tab(){S.tab=b.dataset.t;render()},rq(){S.f.rq=b.dataset.s;render()},nt(){S.nt=b.dataset.v;render()},
  readall(){S.notifs.forEach(n=>n.un=false);render();toast('Semua notifikasi ditandai dibaca')},
  opennt(){const n=S.notifs.find(n=>n.id===b.dataset.id);n.un=false;nav('claim',n.claim)},
  peek(){modal(`<header>${I('file',18)}<h2>${esc(b.dataset.d)}</h2><span class="sp"></span><button class="btn sm" data-act="close">${I('x',14)}</button></header><div class="body"><div class="doc" style="min-height:260px;font-family:Georgia,serif;font-size:13px"><b style="font-size:14px">${esc(b.dataset.d)}</b><div>${x?esc(x.pt.n)+' · '+x.id:''}</div><div style="height:10px;background:var(--line2);border-radius:3px"></div><div style="height:10px;background:var(--line2);border-radius:3px;width:88%"></div><div style="height:10px;background:var(--line2);border-radius:3px;width:94%"></div><div style="height:10px;background:var(--line2);border-radius:3px;width:70%"></div><div class="muted xs" style="margin-top:auto">Pratinjau simulasi. Dokumen asli tidak diunduh dan akses dicatat pada audit trail.</div></div></div>`);if(x)log('Membuka lampiran medis',x.id,b.dataset.d)},
  close(){closeModal()},
  newclaim(){toast('Pengajuan klaim baru disimulasikan pada prototipe ini','file')},
  flag(){openThread(x,b.dataset.f)},
  reply(){const t=x.threads.find(t=>t.id===b.dataset.t);modal(`<header><h2>Balas catatan</h2></header><div class="body"><div class="fld"><label for="m-t">Pesan</label><textarea class="inp" id="m-t"></textarea></div></div><footer><button class="btn" data-act="close">Batal</button><button class="btn pri" id="m-ok">Kirim</button></footer>`,o=>$('#m-ok').onclick=()=>{const v=$('#m-t').value.trim();if(!v)return;t.replies.push({who:S.role,name:S.role==='bpjs'?'Verifikator BPJS':S.user.nama,t:new Date(),text:v});log('Membalas komentar',x.id,v.slice(0,70));notify('info','Balasan baru',v.slice(0,70),x.id);closeModal();render();toast('Balasan terkirim','send')})},
  revise(){reviseModal(x,x.threads.find(t=>t.id===b.dataset.t))},
  dispute(){const t=x.threads.find(t=>t.id===b.dataset.t);modal(`<header>${I('flag',18)}<h2>Ajukan sanggahan</h2></header><div class="body"><p class="muted">Sanggahan akan dikirim ke verifikator BPJS dan klaim berstatus <b>Dispute</b> sampai disepakati.</p><div class="fld"><label for="m-t">Alasan sanggahan</label><textarea class="inp" id="m-t" placeholder="Rujuk dokumen pendukung yang relevan"></textarea></div></div><footer><button class="btn" data-act="close">Batal</button><button class="btn pri" id="m-ok">Kirim sanggahan</button></footer>`,o=>$('#m-ok').onclick=()=>{const v=$('#m-t').value.trim();if(!v){$('#m-t').classList.add('err');return}t.status='dispute';t.replies.push({who:'faskes',name:S.user.nama,t:new Date(),text:'Sanggahan: '+v});x.status='dispute';log('Mengajukan sanggahan',x.id,v.slice(0,70));notify('y','Sanggahan dikirim','Menunggu respons BPJS untuk '+x.id,x.id);closeModal();render();toast('Sanggahan dikirim','send')})},
  accept(){const t=x.threads.find(t=>t.id===b.dataset.t);t.status='agreed';log('Menerima revisi/sanggahan',x.id,FIELDS.find(f=>f.k===t.field).l);if(x.threads.every(t=>t.status==='agreed'))x.status='pending';notify('g','Catatan disepakati',x.id+' · '+FIELDS.find(f=>f.k===t.field).l,x.id);render();toast('Catatan disepakati')},
  reopen(){const t=x.threads.find(t=>t.id===b.dataset.t);t.status='open';x.status='revisi';log('Meminta revisi ulang',x.id,FIELDS.find(f=>f.k===t.field).l);render()},
  approve(){x.status='disetujui';log('Menyetujui klaim',x.id,'Semua catatan disepakati');notify('g','Klaim disetujui',x.id+' siap dibuatkan Berita Acara','');render();toast('Klaim disetujui. Lanjutkan dengan Berita Acara.')},
  mkba(){x.ba=baDraft(x);log('Membuat draf Berita Acara',x.id,x.ba.no);render();toast('Draf Berita Acara dibuat otomatis','seal')},
  savba(){x.ba.kes=$('#b-k').value;x.ba.note=$('#b-n').value.trim();log('Menyunting Berita Acara',x.id,x.ba.no);render();toast('Perubahan disimpan')},
  sign(){signModal(x,b.dataset.w)}};
 A[act]&&A[act]()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('tr.click'))e.target.click()});
document.addEventListener('input',e=>{const i=e.target,id=i.id;
 if(id==='r-p'||id==='p-n'){const s=strength(i.value),col=['var(--line)','var(--rev-fg)','var(--c2)','var(--c4)','var(--ok-fg)'][s];$$('#'+id+'-m i').forEach((el,k)=>el.style.background=k<s?col:'var(--line)');$$('#'+id+'-r li').forEach((li,k)=>li.classList.toggle('ok',pwChecks(i.value)[k][1]))}
 if(id==='c-q'){S.f.q=i.value;render()}if(id==='a-q'){S.at.q=i.value;render()}
 if(id==='gs'&&i.value.length>1){S.f.q=i.value;S.f.st='all';nav('klaim')}});
document.addEventListener('change',e=>{const i=e.target;if(i.id==='c-st'){S.f.st=i.value;render()}if(i.id==='c-lay'){S.f.lay=i.value;render()}if(i.id==='d-lay'){S.f.lay=i.value;render()}if(i.id==='d-per'){S.f.per=i.value;render()}if(i.id==='a-w'){S.at.who=i.value;render()}});
document.addEventListener('submit',async e=>{e.preventDefault();const id=e.target.id;
 if(id==='f-login'){const u=$('#l-u').value,p=$('#l-p').value;$('#l-err').hidden=true;
  if(!u.trim()||!p)return showErr('#l-err','Username dan kata sandi wajib diisi.');
  if(Date.now()<S.lock)return showErr('#l-err',`Terlalu banyak percobaan. Coba lagi dalam ${Math.ceil((S.lock-Date.now())/1000)} detik.`);
  const a=await authenticate(u,p);
  if(!a){S.fails++;if(S.fails>=5){S.lock=Date.now()+30000;S.fails=0;return showErr('#l-err','Terlalu banyak percobaan. Akun dikunci 30 detik.')}return showErr('#l-err',`Username atau kata sandi salah. Sisa percobaan: ${5-S.fails}.`)}
  S.fails=0;S.user=a;S.role=a.role||'faskes';S.flash='';S.f={q:'',st:'all',lay:'all',per:'90',rq:'all'};nav('dashboard');toast('Selamat datang, '+a.nama,'user')}
 if(id==='f-reg'){const g=s=>$('#'+s).value.trim(),n=g('r-n'),u=g('r-u').toLowerCase(),em=g('r-e'),p=$('#r-p').value,c2=$('#r-c').value;$('#r-err').hidden=true;
  if(!n||!u||!em||!p)return showErr('#r-err','Lengkapi nama, username, email, dan kata sandi.');
  if(!/^[a-z0-9._]{4,20}$/.test(u))return showErr('#r-err','Username 4–20 karakter: huruf kecil, angka, titik, atau garis bawah.');
  if(!/^\S+@\S+\.\S+$/.test(em))return showErr('#r-err','Format email belum benar.');
  if(u===DEMO.username||accounts().some(a=>a.username===u))return showErr('#r-err','Username sudah dipakai. Pilih username lain.');
  if(pwChecks(p).some(x=>!x[1]))return showErr('#r-err','Kata sandi belum memenuhi semua syarat.');
  if(p!==c2)return showErr('#r-err','Konfirmasi kata sandi tidak sama.');
  if(!$('#r-a').checked)return showErr('#r-err','Centang pernyataan perlindungan data untuk melanjutkan.');
  const acc=accounts();acc.push({username:u,hash:await sha(u,p),nama:n,email:em,instansi:g('r-i'),role:$('#r-r').value});store.set('ks_acc',acc);
  S.pre=u;S.flash='Akun berhasil dibuat. Silakan masuk.';nav('masuk')}
 if(id==='f-pw'){const u=$('#p-u').value.trim().toLowerCase(),o=$('#p-o').value,n=$('#p-n').value,c2=$('#p-c').value;$('#p-err').hidden=true;
  if(!u||!o||!n)return showErr('#p-err','Lengkapi seluruh kolom.');
  const a=await authenticate(u,o);if(!a)return showErr('#p-err','Username atau kata sandi saat ini salah.');
  if(pwChecks(n).some(x=>!x[1]))return showErr('#p-err','Kata sandi baru belum memenuhi semua syarat.');
  if(n===o)return showErr('#p-err','Kata sandi baru harus berbeda dari yang lama.');
  if(n!==c2)return showErr('#p-err','Konfirmasi kata sandi baru tidak sama.');
  const acc=accounts().filter(x=>x.username!==u);acc.push({...a,username:u,hash:await sha(u,n)});store.set('ks_acc',acc);
  if(S.user){log('Mengganti kata sandi','-','Akun '+u);S.user={...a,username:u};toast('Kata sandi berhasil diganti','key');render()}else{S.pre=u;S.flash='Kata sandi berhasil diganti. Masuk dengan kata sandi baru.';nav('masuk')}}});
addEventListener('hashchange',()=>{const p=S.route+(S.arg?'-'+S.arg:'');if(location.hash.slice(1)!==p){parseHash();render()}});
/* ---- modals ---- */
function openThread(x,field){const F=FIELDS.find(f=>f.k===field);modal(`<header>${I('flag',18)}<h2>Tandai ${F.l}</h2></header><div class="body"><div class="alert info">${I('layers',16)}<span>Catatan terikat pada klaim <b>${x.id}</b>. Nilai saat ini <span class="code">${esc(x[field].code)}</span> ${esc(x[field].name)}</span></div>
 ${field!=='cbg'?`<div class="fld"><label for="m-s">Saran kode ${F.sys} <span class="muted">(opsional)</span></label><input class="inp" id="m-s" placeholder="mis. ${field==='proc'?'36.06':'K35.2'}" autocomplete="off"><div class="hint" id="m-h"></div></div>`:''}
 <div class="fld"><label for="m-t">Catatan untuk Faskes</label><textarea class="inp" id="m-t" placeholder="Jelaskan ketidaksesuaian dan rujuk dokumen"></textarea></div></div><footer><button class="btn" data-act="close">Batal</button><button class="btn pri" id="m-ok">${I('send',15)}Kirim catatan</button></footer>`,o=>{const s=$('#m-s');if(s)s.oninput=()=>{$('#m-h').textContent=ICD[s.value.trim().toUpperCase()]||(s.value?'Kode belum ada di referensi lokal':'')};
 $('#m-ok').onclick=()=>{const v=$('#m-t').value.trim(),sg=s?s.value.trim().toUpperCase():'';if(!v){$('#m-t').classList.add('err');return}
  x.threads.unshift({id:'T'+Date.now(),field,orig:x[field].code,suggest:sg,status:'open',by:'Verifikator BPJS',t:new Date(),text:v,replies:[]});x.status='revisi';
  log('Menandai bidang koding',x.id,F.l+': '+x[field].code+(sg?' → '+sg:''));notify('r','Catatan revisi baru dari BPJS',F.l+' pada '+x.id,x.id);closeModal();render();toast('Catatan revisi dikirim ke Faskes','flag')}})}
function reviseModal(x,t){const F=FIELDS.find(f=>f.k===t.field);modal(`<header>${I('edit',18)}<h2>Revisi ${F.l}</h2></header><div class="body">
 <div class="diff"><span class="muted">Kode saat ini</span><span class="code">${esc(x[t.field].code)}</span>${t.suggest?`<span class="muted">· saran BPJS</span><span class="code" style="background:var(--ok-bg);color:var(--ok-fg)">${esc(t.suggest)}</span>`:''}</div>
 <div class="fld"><label for="m-c">Kode baru (${F.sys})</label><input class="inp" id="m-c" value="${esc(t.suggest||'')}" autocomplete="off"><div class="hint" id="m-h">${esc(ICD[t.suggest]||'')}</div></div>
 <div class="fld"><label for="m-t">Alasan revisi</label><textarea class="inp" id="m-t" placeholder="Dasar dokumen atau catatan DPJP"></textarea></div></div>
 <footer><button class="btn" data-act="close">Batal</button><button class="btn pri" id="m-ok">Simpan revisi</button></footer>`,o=>{const ci=$('#m-c');ci.oninput=()=>{$('#m-h').textContent=ICD[ci.value.trim().toUpperCase()]||(ci.value?'Kode belum ada di referensi lokal':'')};
 $('#m-ok').onclick=()=>{const code=ci.value.trim().toUpperCase(),why=$('#m-t').value.trim();const okfmt=t.field==='proc'?/^\d{2}\.\d{1,2}$/.test(code):t.field==='cbg'?code.length>2:/^[A-Z]\d{2}(\.\d{1,2})?$/.test(code);
  if(!okfmt){ci.classList.add('err');$('#m-h').textContent='Format kode tidak valid untuk '+F.sys;return}if(!why){$('#m-t').classList.add('err');return}
  const old=x[t.field].code;x[t.field]={code,name:ICD[code]||'(nama belum tersedia)'};t.status='revised';t.replies.push({who:'faskes',name:S.user.nama,t:new Date(),text:`Revisi ${old} → ${code}. ${why}`});
  x.status='pending';log('Merevisi koding',x.id,`${F.l}: ${old} → ${code}`);notify('info','Revisi koding dikirim',`${x.id} · ${old} → ${code}`,x.id);closeModal();render();toast('Revisi tersimpan dan dikirim ke BPJS','check')}})}
function signModal(x,who){modal(`<header>${I('pen',18)}<h2>Tanda tangan elektronik</h2></header><div class="body">
 <p class="muted">Menandatangani <b>${x.ba.no}</b> sebagai <b>${who==='faskes'?'Pihak Faskes':'Pihak BPJS Kesehatan'}</b>. Setelah ditandatangani, isi dokumen tidak dapat diubah.</p>
 <div><canvas class="pad" id="cv" aria-label="Area tanda tangan"></canvas><div class="row" style="margin-top:6px"><span class="hint sp">Gambar tanda tangan dengan mouse atau jari.</span><button class="btn sm" id="cv-c">Hapus</button></div></div>
 <div class="alert err" id="s-err" hidden>${I('alert')}<span></span></div>
 ${pwField('s-p','Konfirmasi kata sandi','','current-password')}</div><footer><button class="btn" data-act="close">Batal</button><button class="btn pri" id="m-ok">${I('shield',15)}Tanda tangani</button></footer>`,o=>{
 const cv=$('#cv'),r=cv.getBoundingClientRect();cv.width=r.width*2;cv.height=300;const g=cv.getContext('2d');g.scale(2,2);g.lineWidth=2.2;g.lineCap='round';g.strokeStyle='#1B3A66';let dr=false,dirty=false;
 const pt=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 cv.onpointerdown=e=>{dr=true;cv.setPointerCapture(e.pointerId);g.beginPath();g.moveTo(...pt(e))};cv.onpointermove=e=>{if(!dr)return;g.lineTo(...pt(e));g.stroke();dirty=true};cv.onpointerup=()=>dr=false;
 $('#cv-c').onclick=()=>{g.clearRect(0,0,cv.width,cv.height);dirty=false};
 $('#m-ok').onclick=async()=>{const pw=$('#s-p').value;if(!dirty)return showErr('#s-err','Gambar tanda tangan terlebih dahulu.');
  if(!await authenticate(S.user.username,pw))return showErr('#s-err','Kata sandi salah.');
  const img=cv.toDataURL('image/png'),h=(await sha(x.ba.no,who+Date.now())).slice(0,8);x.ba.sig[who]={name:who==='faskes'?S.user.nama:'Verifikator BPJS',t:new Date(),img,hash:h};if(!x.ba.sig.faskes||!x.ba.sig.bpjs)x.ba.sig=x.ba.sig;
  log('Menandatangani Berita Acara',x.id,x.ba.no);const done=x.ba.sig.faskes&&x.ba.sig.bpjs;if(done){x.status='selesai';notify('g','Berita Acara selesai ditandatangani',x.ba.no+' sah dan tersimpan.',x.id)}else notify('y','Menunggu tanda tangan '+(who==='faskes'?'BPJS':'Faskes'),x.ba.no,x.id);
  closeModal();render();toast(done?'Berita Acara sah dan tersimpan':'Tanda tangan tersimpan','shield')}})}

parseHash();render();
